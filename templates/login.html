<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - LOGTIME SYSTEM</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="WebTime Logo"
                    style="max-width: 200px; height: auto; margin-bottom: 0.5rem;">
                <p>Quản lý thời lượng Live</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/" id="loginForm">
                <div class="form-group">
                    <label class="login-label">TÀI KHOẢN (PLATFORM NAME)</label>
                    <input type="text" class="login-input" id="platform_name" name="platform_name" required
                        placeholder="Nhập tài khoản...">
                </div>
                <div class="form-group">
                    <label class="login-label">MẬT KHẨU (STT)</label>
                    <div class="input-with-icon">
                        <input type="password" class="login-input" id="stt" name="stt" required
                            placeholder="Nhập mật khẩu...">
                        <span class="toggle-password" onclick="togglePass()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn-login-submit" id="loginBtn">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script>
        function togglePass() {
            var x = document.getElementById("stt");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function () {
            var btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span>';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>

</html>
